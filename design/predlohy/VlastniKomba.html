<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>DIREKT – vlastní komba</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
body{margin:0;background:#F3F2EE}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 28px; display: flex; flex-direction: column; background: #F3F2EE; color: #111111; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Zpět" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #E6E4DD; border-radius: 999px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 15px; color: #6B6A66">5 komb</span>
</header>
<h1 style="margin: 12px 0 0; font-stretch: 125%; font-weight: 850; font-size: 40px; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase">Vlastní<br>komba</h1>
<div style="display: flex; flex-direction: column; margin-top: 20px; flex: 1 1 auto">
<sc-for list="{{combos}}" as="c" hint-placeholder-count="5">
<a href="Trenink.dc.html" style="display: flex; flex-direction: column; gap: 12px; padding: 14px 0; border-top: 1px solid #DCDAD3">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-size: 17px; font-weight: 600">{{c.name}}</span>
<span style="font-size: 15px; color: #6B6A66; font-variant-numeric: tabular-nums">{{c.time}}</span>
</div>
<div style="display: flex; gap: 6px">
<sc-for list="{{c.seq}}" as="p" hint-placeholder-count="5">
<sc-if value="{{p.num}}" hint-placeholder-val="{{ true }}">
<span style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #111111; color: #FFFFFF; border-radius: 999px; font-size: 15px; font-weight: 600">{{p.t}}</span>
</sc-if>
<sc-if value="{{p.mod}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 34px; height: 34px; box-sizing: border-box; padding: 0 11px; display: flex; align-items: center; justify-content: center; border: 1.5px solid {{accent}}; color: {{accent}}; border-radius: 999px; font-size: 15px; font-weight: 600">{{p.t}}</span>
</sc-if>
</sc-for>
</div>
</a>
</sc-for>
</div>
<a href="#" style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #111111; color: #FFFFFF; border-radius: 999px; font-size: 17px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Sestavit kombo</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2C3BFF","options":["#2C3BFF","#FF3B2F","#0B8F5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const seq = (s) => s.split(' ').map((t) => {
      const mod = /[A-ZÚ]/.test(t);
      return { t: t, mod: mod, num: !mod };
    });
    const combos = [
      { name: 'Moje 1', seq: seq('1 2 3 T 2 3'), time: '0:16' },
      { name: 'Moje 2', seq: seq('1 2 3 Ú 2'), time: '0:18' },
      { name: 'Moje 3', seq: seq('1 2 LK 2 3'), time: '0:20' },
      { name: 'Kombo na výdrž', seq: seq('1 2 3 2 3 T'), time: '0:24' },
      { name: 'Obrana + útok', seq: seq('Ú 2 3 2 3'), time: '0:20' }
    ];
    return { accent: this.props.accent ?? '#2C3BFF', combos: combos };
  }
}
</script>
</body>
</html>
