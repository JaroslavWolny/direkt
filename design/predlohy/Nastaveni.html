<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>DIREKT – nastavení</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
body{margin:0;background:#F3F2EE}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #F3F2EE; color: #111111; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="Main.dc.html" aria-label="Zpět" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #E6E4DD; border-radius: 999px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-stretch: 125%; font-weight: 850; font-size: 40px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase">Nastavení</h1>
</div>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #6B6A66">Hlas trenéra</h2>
<div style="display: flex; flex-direction: column; padding: 0 16px; background: #FFFFFF; border-radius: 20px">
<div style="min-height: 64px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600">Zuzana</span>
<span style="font-size: 13px; color: #6B6A66">Čeština (cs-CZ)</span>
</div>
<button type="button" aria-label="Přehrát ukázku hlasu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #FFFFFF; border: 0; border-radius: 999px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></button>
</div>
<a href="#" style="min-height: 50px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #ECEAE4; font-size: 15px">Další hlasy a stažení<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #6B6A66">Intenzita</h2>
<div role="group" aria-label="Intenzita" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E6E4DD; border-radius: 999px">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<sc-if value="{{l.on}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{l.pick}}" style="height: 44px; background: #111111; color: #FFFFFF; border: 0; border-radius: 999px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">{{l.label}}</button>
</sc-if>
<sc-if value="{{l.off}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{l.pick}}" style="height: 44px; background: transparent; color: #111111; border: 0; border-radius: 999px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; cursor: pointer">{{l.label}}</button>
</sc-if>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #6B6A66">Kolo</h2>
<div style="display: flex; flex-direction: column; padding: 0 16px; background: #FFFFFF; border-radius: 20px">
<div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px">Délka kola</span>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Zkrátit kolo" onClick="{{roundDown}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F3F2EE; color: #111111; border: 0; border-radius: 999px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="width: 68px; text-align: center; font-stretch: 125%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums">{{roundLabel}}</span>
<button type="button" aria-label="Prodloužit kolo" onClick="{{roundUp}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F3F2EE; color: #111111; border: 0; border-radius: 999px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
<div style="min-height: 60px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #ECEAE4">
<span style="font-size: 15px">Pauza mezi koly</span>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="Zkrátit pauzu" onClick="{{restDown}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F3F2EE; color: #111111; border: 0; border-radius: 999px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="width: 68px; text-align: center; font-stretch: 125%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums">{{restLabel}}</span>
<button type="button" aria-label="Prodloužit pauzu" onClick="{{restUp}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F3F2EE; color: #111111; border: 0; border-radius: 999px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #6B6A66">Přehrávání</h2>
<div style="display: flex; flex-direction: column; padding: 0 16px; background: #FFFFFF; border-radius: 20px">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="2">
<button type="button" role="switch" aria-checked="{{t.checked}}" onClick="{{t.flip}}" style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0; background: transparent; color: #111111; border: 0; border-top: {{t.border}}; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; text-align: left; cursor: pointer">
<span>{{t.label}}</span>
<span aria-hidden="true" style="width: 50px; height: 30px; box-sizing: border-box; padding: 3px; display: flex; justify-content: {{t.justify}}; background: {{t.track}}; border-radius: 999px"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFFFF"></span></span>
</button>
</sc-for>
</div>
</section>
<a href="#" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-radius: 20px; font-size: 15px">O aplikaci<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2C3BFF","options":["#2C3BFF","#FF3B2F","#0B8F5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 'Střední', round: 240, rest: 60, silent: false, autoPause: true };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2C3BFF';
    const s = this.state;
    const fmt = (x) => Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0');
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const levels = ['Lehká', 'Střední', 'Tvrdá'].map((label) => ({
      label: label,
      on: s.level === label,
      off: s.level !== label,
      pick: () => this.setState({ level: label })
    }));
    const toggle = (key, label, first) => {
      const on = !!s[key];
      return {
        label: label,
        checked: on ? 'true' : 'false',
        justify: on ? 'flex-end' : 'flex-start',
        track: on ? accent : '#D6D4CD',
        border: first ? '0' : '1px solid #ECEAE4',
        flip: () => this.setState({ [key]: !on })
      };
    };
    return {
      accent: accent,
      levels: levels,
      roundLabel: fmt(s.round),
      restLabel: fmt(s.rest),
      roundDown: () => this.setState({ round: clamp(s.round - 30, 60, 600) }),
      roundUp: () => this.setState({ round: clamp(s.round + 30, 60, 600) }),
      restDown: () => this.setState({ rest: clamp(s.rest - 15, 15, 300) }),
      restUp: () => this.setState({ rest: clamp(s.rest + 15, 15, 300) }),
      toggles: [toggle('silent', 'Hrát i v tichém režimu', true), toggle('autoPause', 'Automatická pauza na pozadí', false)]
    };
  }
}
</script>
</body>
</html>
