<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>DIREKT – dotazník 2: cíl</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
body{margin:0;background:#F3F2EE}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 28px; display: flex; flex-direction: column; background: #F3F2EE; color: #111111; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Otazka1.html" aria-label="Zpět" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #E6E4DD; border-radius: 999px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 15px; font-weight: 600">2 ze 3</span>
<span aria-hidden="true" style="width: 44px"></span>
</header>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 20px">
<div style="height: 4px; background: #111111; border-radius: 2px"></div>
<div style="height: 4px; background: #111111; border-radius: 2px"></div>
<div style="height: 4px; background: #DCDAD3; border-radius: 2px"></div>
</div>
<h1 style="margin: 28px 0 0; font-stretch: 125%; font-weight: 850; font-size: 34px; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase">Co chceš<br>zlepšit?</h1>
<p style="margin: 10px 0 0; font-size: 15px; color: #6B6A66">Vyber klidně víc možností.</p>
<div role="group" aria-label="Cíle" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 24px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="6">
<sc-if value="{{g.on}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{g.flip}}" style="height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 18px; background: {{accent}}; color: #FFFFFF; border: 0; border-radius: 20px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; text-align: left; cursor: pointer">
<span style="font-size: 17px; font-weight: 600">{{g.label}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</button>
</sc-if>
<sc-if value="{{g.off}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{g.flip}}" style="height: 64px; display: flex; align-items: center; padding: 0 18px; background: #FFFFFF; color: #111111; border: 0; border-radius: 20px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; text-align: left; cursor: pointer">
<span style="font-size: 17px; font-weight: 600">{{g.label}}</span>
</button>
</sc-if>
</sc-for>
</div>
<div style="flex: 1 1 auto"></div>
<a href="Otazka3.html" style="height: 60px; display: flex; align-items: center; justify-content: center; background: #111111; color: #FFFFFF; border-radius: 999px; font-size: 17px; font-weight: 600">Pokračovat</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2C3BFF","options":["#2C3BFF","#FF3B2F","#0B8F5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { 0: true, 1: true } };
  }
  renderVals() {
    const labels = ['Kondici', 'Techniku', 'Sílu úderu', 'Rychlost', 'Obranu', 'Vyčistit hlavu'];
    const goals = labels.map((label, i) => {
      const on = !!this.state.picked[i];
      return {
        label: label,
        on: on,
        off: !on,
        flip: () => this.setState({ picked: Object.assign({}, this.state.picked, { [i]: !on }) })
      };
    });
    return { accent: this.props.accent ?? '#2C3BFF', goals: goals };
  }
}
</script>
</body>
</html>
