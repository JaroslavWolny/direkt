<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>DIREKT – dotazník 1: zkušenost</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
body{margin:0;background:#F3F2EE}
a{color:#111111;text-decoration:none}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 28px; display: flex; flex-direction: column; background: #F3F2EE; color: #111111; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Uvod.html" aria-label="Zpět" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #E6E4DD; border-radius: 999px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 15px; font-weight: 600">1 ze 3</span>
<span aria-hidden="true" style="width: 44px"></span>
</header>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 20px">
<div style="height: 4px; background: #111111; border-radius: 2px"></div>
<div style="height: 4px; background: #DCDAD3; border-radius: 2px"></div>
<div style="height: 4px; background: #DCDAD3; border-radius: 2px"></div>
</div>
<h1 style="margin: 28px 0 0; font-stretch: 125%; font-weight: 850; font-size: 34px; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase">Jak dlouho<br>boxuješ?</h1>
<p style="margin: 10px 0 0; font-size: 15px; color: #6B6A66">Podle toho nastavím tempo a komba.</p>
<div role="radiogroup" aria-label="Zkušenost" style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="4">
<sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
<button type="button" role="radio" aria-checked="true" onClick="{{o.pick}}" style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; background: #111111; color: #FFFFFF; border: 0; border-radius: 20px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; text-align: left; cursor: pointer">
<span style="font-size: 17px; font-weight: 600">{{o.title}}</span>
<span aria-hidden="true" style="width: 26px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; background: {{accent}}; border-radius: 999px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>
</sc-if>
<sc-if value="{{o.off}}" hint-placeholder-val="{{ true }}">
<button type="button" role="radio" aria-checked="false" onClick="{{o.pick}}" style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; background: #FFFFFF; color: #111111; border: 0; border-radius: 20px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; text-align: left; cursor: pointer">
<span style="font-size: 17px; font-weight: 600">{{o.title}}</span>
<span aria-hidden="true" style="width: 26px; height: 26px; flex: none; box-sizing: border-box; border: 2px solid #DCDAD3; border-radius: 999px"></span>
</button>
</sc-if>
</sc-for>
</div>
<div style="flex: 1 1 auto"></div>
<a href="Otazka2.html" style="height: 60px; display: flex; align-items: center; justify-content: center; background: #111111; color: #FFFFFF; border-radius: 999px; font-size: 17px; font-weight: 600">Pokračovat</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2C3BFF","options":["#2C3BFF","#FF3B2F","#0B8F5A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const items = ['Začínám', 'Pár měsíců', 'Rok a víc', 'Závodím'];
    const options = items.map((title, i) => ({
      title: title,
      on: this.state.picked === i,
      off: this.state.picked !== i,
      pick: () => this.setState({ picked: i })
    }));
    return { accent: this.props.accent ?? '#2C3BFF', options: options };
  }
}
</script>
</body>
</html>
