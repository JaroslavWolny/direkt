<!doctype html>
<html lang="cs" style="--sat: 59px; --sab: 34px">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=393" />
    <title>DIREKT — kolo (do telefonu v promo videu)</title>
    <!-- Skutečné CSS appky; markup obrazovky kola zkopírovaný z běžící appky (WorkoutScreen, 9.2). -->
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="screen spread on-accent">
      <div class="stack gap-20">
        <header class="top-bar">
          <button type="button" class="icon-btn on-accent" tabindex="-1">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
          <span class="top-bar-title">Kolo 1 ze 3</span>
          <button type="button" class="icon-btn on-accent" tabindex="-1">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
          </button>
        </header>
        <span class="progress" aria-hidden="true">
          <span style="background: var(--white-a30)"><i id="progress" style="width: 0%; background: var(--white)"></i></span>
          <span style="background: var(--white-a30)"><i style="width: 0%; background: var(--white)"></i></span>
          <span style="background: var(--white-a30)"><i style="width: 0%; background: var(--white)"></i></span>
        </span>
      </div>
      <div class="stack gap-6">
        <span class="label-15">Zbývá</span>
        <div class="timer" id="timer">3:00</div>
      </div>
      <section class="stack gap-16">
        <div class="top-bar label-15"><span id="label">Kombo</span><span id="count"></span></div>
        <span class="words" id="words"></span>
        <div class="say">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M17 9a4 4 0 010 6M19.5 6.5a7.5 7.5 0 010 11"></path></svg>
          <span id="say">Poslouchej trenéra.</span>
        </div>
      </section>
      <div class="controls">
        <button type="button" class="control" tabindex="-1">
          <span class="ring"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14l9-7z" fill="currentColor"></path><path d="M18 5v14"></path></svg></span>
          Další kolo
        </button>
        <button type="button" class="big-pause" tabindex="-1">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </button>
        <button type="button" class="control" tabindex="-1">
          <span class="ring"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></span>
          Konec
        </button>
      </div>
    </div>
    <script>
      // Stav obrazovky řídí promo.html: { timer, progress, label, count, words: [{ text, state }], say }
      const $ = (id) => document.getElementById(id)
      window.setRound = (s) => {
        $('timer').textContent = s.timer
        $('progress').style.width = `${s.progress * 100}%`
        $('label').textContent = s.label
        $('count').textContent = s.count
        $('say').textContent = s.say
        $('words').innerHTML = s.words
          .map((w) => `<span${w.state ? ` class="${w.state}"` : ''}>${w.text}</span>`)
          .join('')
      }
    </script>
  </body>
</html>
