<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DIREKT — anglická story „Autopilot"</title>
    <link rel="stylesheet" href="../brand.css" />
    <style>
      /* DOKUMENTACE.md 15.4 — 1080 × 1920, důležité jen v pásu y 250–1580.
         Zeď z „1-2" (ty na autopilotu) → trenér ji prorazí → kolo zrychleně v telefonu → zeď z 50 komb. */
      body,
      .stage {
        width: 1080px;
        height: 1920px;
      }

      .stage {
        position: relative;
        overflow: hidden;
        background: var(--ink);
        color: var(--white);
      }

      #cam,
      #world,
      .layer {
        position: absolute;
        inset: 0;
      }

      .grp {
        position: absolute;
        inset: 0;
        display: none;
      }

      /* široké těžké verzálky appky */
      .t {
        position: absolute;
        display: block;
        width: max-content;
        font-stretch: 125%;
        font-weight: 900;
        line-height: 0.94;
        letter-spacing: -0.01em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .stack {
        position: absolute;
        left: 72px;
      }

      .stack .t {
        position: relative;
      }

      .mask {
        overflow: hidden;
        padding-top: 0.16em;
        margin-top: -0.16em;
      }

      .label {
        position: absolute;
        left: 72px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .sub {
        position: absolute;
        left: 72px;
        font-size: 36px;
        font-weight: 500;
        white-space: nowrap;
      }

      /* ---------- zeď komb ---------- */
      .tok {
        position: absolute;
        top: 0;
        left: 0;
        font-stretch: 125%;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      #wall {
        background: var(--paper);
        color: var(--ink);
        mask-composite: intersect;
      }

      #wall .tok,
      #debris .tok {
        color: #dcdad2;
        font-size: 150px;
      }

      #hook .t .c {
        display: inline-block;
      }

      #debris .ch {
        position: absolute;
        font-stretch: 125%;
        font-weight: 900;
        line-height: 0.94;
        letter-spacing: -0.01em;
        color: var(--ink);
        white-space: nowrap;
      }

      #debris .lbl {
        position: absolute;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--muted);
      }

      #rings {
        position: absolute;
        inset: 0;
        overflow: visible;
      }

      /* ---------- trenér (pod zdí) ---------- */
      #coach {
        background: var(--accent);
      }

      .hole-num {
        font-size: 430px;
      }

      .hole-name {
        left: 0;
        letter-spacing: 0.1em;
      }

      /* ---------- telefon ---------- */
      #bleed {
        background: var(--accent);
      }

      #bezel {
        position: absolute;
        background: #262624; /* darkFill appky — černý rám by na ink pozadí zmizel */
      }

      #glass {
        position: absolute;
        overflow: hidden;
        background: var(--accent);
      }

      #glass iframe {
        display: block;
        width: 393px;
        height: 852px;
        border: 0;
        transform-origin: 0 0;
      }

      #glass .island {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #000;
      }

      #glass .status {
        position: absolute;
        right: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--white);
        font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #glass .status svg {
        display: block;
        width: auto;
      }

      #glass .status .icons {
        display: flex;
        align-items: center;
      }

      /* ---------- výzva ---------- */
      #cta {
        background: var(--accent);
      }

      #cta .tok {
        color: var(--white);
        font-size: 84px;
      }

      #band {
        position: absolute;
        right: 0;
        left: 0;
        height: 760px;
        background: var(--ink);
      }

      .end-row {
        position: absolute;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 30px;
      }

      .end-row img {
        display: block;
        width: 132px;
        height: 132px;
        border-radius: 22.5%;
      }

      .url {
        font-size: 56px;
        font-weight: 700;
        white-space: nowrap;
      }

      .hint {
        margin-top: 10px;
        font-size: 34px;
        font-weight: 500;
        white-space: nowrap;
        color: var(--muted-on-dark);
      }

      .caret {
        display: inline-block;
        width: 0.5em;
        height: 0.9em;
        margin-left: 4px;
        vertical-align: -0.12em;
        background: var(--white);
      }

      /* ---------- impact frame ---------- */
      #flash {
        position: absolute;
        inset: 0;
        display: none;
      }

      #flash svg {
        position: absolute;
        inset: 0;
      }

      #flashText {
        line-height: 0.8;
      }
    </style>
  </head>
  <body>

      <!-- impact frame: přes všechno, netřese se -->

    <script type="module">
      // Scénář DOKUMENTACE.md 15.4. Obraz i zvuk z jedné časové osy; seek(t) je čistá funkce času.
      const FPS = 30
      const DURATION = 15.95
      const SUBFRAMES = 4 // motion blur: 4 dílčí snímky na snímek (render.mjs je zprůměruje)
      const GRAIN = 4 // jemné filmové zrno; silnější IG při kompresi rozbije
      const VOICE = '/public/voice/harry/'
      const W = 936 // šířka sazby (okraje 72)
      const query = new URLSearchParams(location.search)

      // ---------- háček (varianty: ?hook=2 …) ----------
      // [popisek, řádky…] — každý řádek přesně na šířku sazby
      const HOOKS = [
        ['Alone on the bag', 'Same', '1-2.', 'Every round.'],
        ['Alone on the bag', 'You throw', 'what you', 'know.'],
        ['Round 3. Bag work.', '1-2. 1-2.', '1-2-3.', '1-2. 1-2.'],
        ['Nobody calling it', 'The bag', 'never', 'calls.'],
      ]
      const HOOK = HOOKS[(Number(query.get('hook')) || 1) - 1] ?? HOOKS[0]

      // ---------- časová osa ----------
      const A1 = { pairs: [0.04, 0.7, 1.36], gap: 0.22, freeze: 1.95 } // líné dvojice 1-2, pak zeď zamrzne
      // kombo e07 „5 4 3t" (kap. 6); bias = kam letí trosky: zvedák nahoru, zadní hák zprava, hák na tělo zleva
      const HOLES = [
        { call: 1.95, clip: 'n5', t: 2.3, x: 330, y: 760, r: 280, num: '5', name: 'Uppercut', bias: [0.15, -0.8] },
        { call: 2.53, clip: 'n4', t: 2.82, x: 775, y: 1075, r: 270, num: '4', name: 'Rear hook', bias: [-0.75, -0.15] },
        { call: 3.03, clip: 't3', t: 3.42, x: 430, y: 1370, r: 290, num: '3', name: 'Body hook', bias: [0.75, 0.05] },
      ]
      const IRIS = { t: 3.5, dur: 0.32, r1: 2400 } // třetí díra se rozevře přes celý obraz
      const CAP = 3.84
      const GONG = 4.9
      const LAST_SAY = 5.2 // „Last round!" 0,3 s po gongu jako v appce
      // poslední kolo zrychleně: jump cut = čas skočí, mezi skoky jedno skutečné hlášení (kombo z kap. 6)
      const CUTS = [
        { t: 6.2, left: 161, moves: ['1', '2'], voice: [[6.23, 'n1'], [6.73, 'n2']], hits: [6.47, 6.95], flash: [6.47, '1'] },
        { t: 7.2, left: 132, moves: ['2', '3'], voice: [[7.23, 'n2'], [7.69, 'n3']], hits: [7.45, 7.93], flash: [7.45, '2'], zoom: 1.1 },
        { t: 8.25, left: 107, moves: ['2', '3'], again: true, voice: [[8.28, 'znovu']], hits: [8.62, 8.8], flash: [8.62, 'Again'], zoom: 1.05, rot: -1.6 },
        { t: 8.95, left: 80, moves: ['SLIP', '2'], voice: [[8.98, 'uklon'], [9.48, 'n2']], hits: [9.7], dodge: 9.2, flash: [9.2, 'Slip'] },
        { t: 10.0, left: 10, finisher: true, claps: [10.02, 10.18], voice: [[10.25, 'naplno']], hits: [10.5, 10.6, 10.69, 10.79, 10.88, 10.98, 11.07, 11.17], flash: [10.5, 'All out'] },
      ]
      const END = 11.3 // gong, konec kola
      const PULL = 0.6 // kamera odjede z displeje
      const THROW = 11.75
      const CTA = { t: 13.1, iris: 0.34, brand: 13.45, lines: 13.5, sub: 13.75, band: 13.55, type: 13.85, hint: 14.4 }
      const URL = 'direkt-indol.vercel.app'
      const TYPE_STEP = 0.02
      const ROUND_TEXT = { title: 'Round 3 of 3', remaining: 'Time left', next: 'Next round' }

      // telefon: obrazovka 393 × 852 bodů, PS = px na bod (konečný záběr)
      const PS = 1.4
      const GLASS = { x: (1080 - 393 * PS) / 2, y: 640, w: 393 * PS, h: 852 * PS, r: 55 * PS }
      // v kole kamera uvnitř displeje: 2,6 px na bod, horní lišta (bod 100) na y 278 → vše od lišty po „say" v pásu
      const Z0 = 2.6 / PS
      const OY = (278 - Z0 * (GLASS.y + 100 * PS)) / (1 - Z0)

      const $ = (id) => document.getElementById(id)
      const clamp01 = (x) => Math.min(1, Math.max(0, x))
      const lerp = (a, b, p) => a + (b - a) * p
      const prog = (t, t0, dur) => clamp01((t - t0) / dur)
      const easeOut = (x) => 1 - (1 - x) ** 3
      const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x))
      const easeIn = (x) => x ** 3
      const easeInOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2)
      const easeOutBack = (x, k = 1.7) => 1 + (k + 1) * (x - 1) ** 3 + k * (x - 1) ** 2
      /** Pružina po impulsu: hned plná výchylka, tlumené kmity. */
      const spring = (u, f = 3, damp = 6) => (u < 0 ? 0 : Math.exp(-damp * u) * Math.cos(2 * Math.PI * f * u) * Math.min(1, u / 0.025 + 0.35))
      function mulberry32(a) {
        return () => {
          a |= 0
          a = (a + 0x6d2b79f5) | 0
          let t = Math.imul(a ^ (a >>> 15), 1 | a)
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296
        }
      }
      const show = (el, on) => (el.style.display = on ? 'block' : 'none')
      /** Dopad: z většího a natažený, pak sedí a pomalu se tlačí ke kameře. */
      function slam(el, t, t0, from = 1.3, origin = '0% 100%') {
        const p = easeOutExpo(prog(t, t0, 0.14))
        const push = 1 + 0.03 * easeOut(prog(t, t0 + 0.14, 0.7))
        el.style.transformOrigin = origin
        el.style.transform = `scale(${lerp(from, 1, p) * push})`
      }
      /** Řádek vyjede zpod hrany masky. */
      function roll(el, t, tin) {
        const p = easeOutExpo(prog(t, tin, 0.26))
        el.style.visibility = t >= tin ? 'visible' : 'hidden'
        el.style.transform = `translateY(${(1 - p) * 110}%)`
      }
      const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
      const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`
      const WALL_RGB = [220, 218, 210]
      const INK_RGB = [17, 17, 17]

      // ---------- zeď ----------
      const ROW_H = 172
      const WALL_TOP = -60
      const DRIFT = 42 // px/s, řady jedou střídavě doleva a doprava
      const LIT_ROW = 8 // řada pod titulkem, kde se „autopilot" rozsvěcí po pořadí
      let tokens = [] // { el, x, y, w, h, dir, row }
      let pieces = [] // všechno, co může vyletět: { el (ve zdi), clone (trosky), cx, cy, hit, v, vs, w, push }
      let lit = [] // [{ tok, t }]
      let hookBox = null
      const tokX = (tok, t) => tok.x + tok.dir * DRIFT * Math.min(t, A1.freeze)

      function buildWall() {
        const rnd = mulberry32(7)
        for (let r = 0; r < 12; r++) {
          let x = -520 + (r % 3) * 95
          const dir = r % 2 ? 1 : -1
          while (x < 1600) {
            const el = document.createElement('span')
            el.className = 'tok'
            el.textContent = rnd() < 0.2 ? '1-2-3' : '1-2'
            $('tokens').append(el)
            const tok = { el, x, y: WALL_TOP + r * ROW_H, w: el.offsetWidth, h: el.offsetHeight, dir, row: r }
            tokens.push(tok)
            x += tok.w + 64
          }
        }
        // autopilot: v řadě pod titulkem se rozsvěcí jedno kombo za druhým, zleva doprava
        const row = tokens.filter((k) => k.row === LIT_ROW && tokX(k, 0) > 40 && tokX(k, 0) + k.w < 1040).sort((a, b) => a.x - b.x)
        lit = A1.pairs.map((t, i) => ({ tok: row[i % row.length], t }))
      }

      function buildHook() {
        $('hkLabel').textContent = HOOK[0]
        $('hkLines').innerHTML = HOOK.slice(1)
          .map((line) => `<span class="t" data-qa>${[...line].map((c) => `<span class="c">${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</span>`)
          .join('')
        $('hkLines').querySelectorAll('.t').forEach(fit)
        const a = $('hkLabel').getBoundingClientRect()
        const b = $('hkLines').getBoundingClientRect()
        hookBox = { l: 72 - 24, t: a.top - 24, r: 1008 + 24, b: b.bottom + 10 }
      }

      /** Trosky: kopie každého kusu zdi a titulku; zásah, směr a rychlost se určí předem (seed). */
      function buildDebris() {
        const add = (el, cls, cx, cy, extra = {}) => {
          const clone = document.createElement('span')
          clone.className = cls
          clone.textContent = el.textContent
          if (extra.fontSize) clone.style.fontSize = extra.fontSize
          $('debris').append(clone)
          const w = el.offsetWidth
          const h = el.offsetHeight
          clone.style.left = `${cx - w / 2}px`
          clone.style.top = `${cy - h / 2}px`
          pieces.push({ el, clone, cx, cy, push: [], tok: extra.tok })
        }
        for (const k of tokens) add(k.el, 'tok', tokX(k, A1.freeze) + k.w / 2, k.y + k.h / 2, { tok: k })
        for (const line of $('hkLines').querySelectorAll('.t')) {
          for (const c of line.querySelectorAll('.c')) {
            const r = c.getBoundingClientRect()
            add(c, 'ch', r.left + r.width / 2, r.top + r.height / 2, { fontSize: line.style.fontSize })
          }
        }
        const r = $('hkLabel').getBoundingClientRect()
        add($('hkLabel'), 'lbl', r.left + r.width / 2, r.top + r.height / 2)

        const rnd = mulberry32(21)
        const unit = (x, y) => {
          const d = Math.hypot(x, y) || 1
          return [x / d, y / d]
        }
        for (const p of pieces) {
          for (const h of HOLES) {
            const dx = p.cx - h.x
            const dy = p.cy - h.y
            const d = Math.hypot(dx, dy) || 1
            if (p.hit == null && d < h.r * 1.08) {
              const [ux, uy] = unit(dx / d + h.bias[0], dy / d + h.bias[1])
              const v = 1500 + 1500 * rnd()
              Object.assign(p, { hit: h.t + 0.025 * (d / h.r), v: [ux * v, uy * v], vs: 0.4 + rnd(), w: (rnd() * 2 - 1) * 760 })
            } else if (p.hit == null && d < h.r * 1.9) {
              p.push.push({ t: h.t, ux: dx / d, uy: dy / d, a: 50 * (1 - (d - h.r * 1.08) / (h.r * 0.82)) })
            }
          }
          const irisHit = (x, y) => {
            const h = HOLES[2]
            return IRIS.t + IRIS.dur * Math.cbrt(clamp01((Math.hypot(x - h.x, y - h.y) - h.r) / (IRIS.r1 - h.r)))
          }
          if (p.hit != null && p.hit < IRIS.t) {
            // rozevření smete i trosky, které už letí (jinak by zůstaly přes pointu)
            const [x, y] = debrisAt(p, IRIS.t - p.hit)
            const [ux, uy] = unit(p.cx + x - HOLES[2].x, p.cy + y - HOLES[2].y)
            p.kick = Math.max(IRIS.t, irisHit(p.cx + x, p.cy + y))
            p.k2 = [ux * 4200, uy * 4200]
          }
          if (p.hit == null) {
            // tlaková vlna rozevírající se díry: kus vyletí, když k němu dojde hrana
            const h = HOLES[2]
            const dx = p.cx - h.x
            const dy = p.cy - h.y
            const d = Math.hypot(dx, dy)
            const [ux, uy] = unit(dx, dy)
            const v = 3600 + 2000 * rnd()
            Object.assign(p, {
              hit: irisHit(p.cx, p.cy),
              v: [ux * v, uy * v],
              vs: 0.3 + 0.7 * rnd(),
              w: (rnd() * 2 - 1) * 600,
            })
          }
        }
      }

      /** Posun trosky za čas u od zásahu: odpor vzduchu + gravitace. */
      function debrisAt(p, u) {
        const drag = (1 - Math.exp(-2.2 * u)) / 2.2
        return [p.v[0] * drag, p.v[1] * drag + 0.5 * 3400 * u * u]
      }

      /** Poloměr díry v čase (s překmitem po zásahu; třetí se rozevře přes obraz). */
      function holeR(h, i, t) {
        if (t < h.t) return 0
        const r = h.r * easeOutBack(prog(t, h.t, 0.16), 1.8)
        return i === 2 && t >= IRIS.t ? lerp(h.r, IRIS.r1, easeIn(prog(t, IRIS.t, IRIS.dur))) : r
      }

      function buildHoles() {
        $('holes').innerHTML = HOLES.map(
          (h, i) => `<div class="hole" id="hole${i}"><span class="t hole-num" data-qa>${h.num}</span><span class="label hole-name" data-qa>${h.name}</span></div>`,
        ).join('')
        HOLES.forEach((h, i) => {
          const num = $(`hole${i}`).querySelector('.hole-num')
          const name = $(`hole${i}`).querySelector('.hole-name')
          num.style.left = `${h.x - num.offsetWidth / 2}px`
          num.style.top = `${h.y - num.offsetHeight * 0.56}px`
          name.style.left = `${h.x - name.offsetWidth / 2}px`
          name.style.top = `${h.y + h.r * 0.56}px`
        })
        $('rings').innerHTML = HOLES.map((_, i) => `<circle id="ring${i}" fill="none" stroke="#111" />`).join('')
      }

      function drawWall(t) {
        // díry: maska zdi (průhledné kruhy) + inkoustový kroužek vně díry jako pytel z ikony
        const masks = []
        HOLES.forEach((h, i) => {
          const r = holeR(h, i, t)
          const ring = $(`ring${i}`)
          ring.style.display = r > 0 ? 'block' : 'none'
          if (r <= 0) return
          const w = 0.117 * r
          masks.push(`radial-gradient(circle at ${h.x}px ${h.y}px, transparent ${r}px, #000 ${r + 1}px)`)
          ring.setAttribute('cx', h.x)
          ring.setAttribute('cy', h.y)
          ring.setAttribute('r', r + w / 2)
          ring.setAttribute('stroke-width', w)
        })
        $('wall').style.maskImage = masks.length ? masks.join(',') : 'none'

        for (const k of tokens) {
          const x = tokX(k, t)
          const over = x < hookBox.r && x + k.w > hookBox.l && k.y < hookBox.b && k.y + k.h > hookBox.t
          let c = 0
          for (const l of lit) if (l.tok === k && t >= l.t) c = Math.max(c, 1 - easeIn(prog(t, l.t + 0.25, 0.7)))
          k.el.style.color = mix(WALL_RGB, INK_RGB, c)
          k.el.style.opacity = over && c === 0 ? 0.35 : 1
          k.base = [x, k.y]
        }
        // líný úder: rozsvícené kombo cukne
        for (const l of lit) {
          let kick = 0
          for (const d of [0, A1.gap]) kick += 0.05 * spring(t - l.t - d, 3, 10)
          l.tok.kick = kick
        }

        for (const p of pieces) {
          const before = t < p.hit
          // kus ve zdi (u tokenů poloha z driftu, u titulku jen postrčení)
          let px = 0
          let py = 0
          for (const s of p.push) {
            const a = s.a * spring(t - s.t, 2.4, 7)
            px += s.ux * a
            py += s.uy * a
          }
          const tok = p.tok
          p.el.style.visibility = before ? 'visible' : 'hidden'
          if (tok) p.el.style.transform = `translate(${tok.base[0] + px}px, ${tok.y + py}px) scale(${1 + (tok.kick ?? 0)})`
          else p.el.style.transform = `translate(${px}px, ${py}px)`
          // troska
          const u = t - p.hit
          const fly = !before && u < 1.3 && t < CAP + 0.3
          p.clone.style.display = fly ? 'block' : 'none'
          if (!fly) continue
          let [x, y] = debrisAt(p, u)
          if (p.kick != null && t >= p.kick) {
            const d2 = (1 - Math.exp(-2.2 * (t - p.kick))) / 2.2
            x += p.k2[0] * d2
            y += p.k2[1] * d2
          }
          p.clone.style.transform = `translate(${x}px, ${y}px) rotate(${p.w * u}deg) scale(${1 + p.vs * u})`
        }
      }

      // ---------- trenér: čísla v dírách, po rozevření pointa ----------
      function drawCoach(t) {
        HOLES.forEach((h, i) => {
          const g = $(`hole${i}`)
          show(g, t >= h.t)
          if (t < h.t) return
          const num = g.querySelector('.hole-num')
          slam(num, t, h.t, 1.45, '50% 60%')
          const name = g.querySelector('.hole-name')
          name.style.visibility = t >= h.t + 0.08 ? 'visible' : 'hidden'
          // po rozevření se čísla ztlumí a nad nimi naskočí pointa
          g.style.opacity = lerp(1, 0.16, easeOut(prog(t, CAP - 0.06, 0.24)))
        })
        $('cap').querySelectorAll('.t').forEach((el, j) => {
          roll(el, t, CAP + j * 0.08)
          el.style.scale = 1 + 0.02 * prog(t, CAP + 0.3, 1)
        })
      }

      // ---------- poslední kolo: stav obrazovky appky ----------
      const roundWin = () => $('round').contentWindow
      function cutAt(t) {
        let k = -1
        CUTS.forEach((c, i) => t >= c.t && (k = i))
        return k
      }
      /** Sekundy do konce kola (bez přetočení). */
      function secondsLeft(t) {
        const k = cutAt(t)
        if (k < 0) return 180 - Math.floor(Math.max(0, t - GONG))
        const c = CUTS[k]
        if (c.finisher) return Math.max(0, Math.ceil(10 - (10 * (t - c.t)) / (END - c.t) - 1e-9))
        return c.left - Math.floor(t - c.t)
      }
      /** Čas na displeji: těsně před střihem proletí čísla až k novému času (přetočení). */
      function shownSeconds(t) {
        const n = CUTS.find((c) => t >= c.t - 0.16 && t < c.t)
        if (!n) return secondsLeft(t)
        return Math.round(lerp(secondsLeft(n.t - 0.16), n.left, easeIn(prog(t, n.t - 0.16, 0.16))))
      }
      const NUM_WORD = { 1: 'one', 2: 'two', 3: 'three', SLIP: 'slip' }
      function roundState(t) {
        const tt = Math.min(t, END)
        const left = shownSeconds(tt)
        const base = { ...ROUND_TEXT, timer: mmss(left), progress: 1, bars: [1, 1, (180 - left) / 180] }
        const k = cutAt(tt)
        if (k >= 0 && CUTS[k].finisher) {
          return { ...base, label: 'Finisher', count: 'To the bell', words: [{ text: 'ALL OUT', state: 'now' }], say: '“All out!”' }
        }
        const c = CUTS[Math.max(0, k)]
        const punches = c.moves.filter((m) => m !== 'SLIP').length
        const words = (current) => c.moves.map((text, i) => ({ text, state: current < 0 ? '' : i < current ? 'done' : i === current ? 'now' : '' }))
        const said = `“${c.moves.map((m) => NUM_WORD[m]).join(', ').replace(/^./, (x) => x.toUpperCase())}!”`
        if (k < 0) {
          return { ...base, label: 'Combo', count: `${punches} punches`, words: words(-1), say: tt >= LAST_SAY ? '“Last round!”' : 'Listen to the coach.' }
        }
        if (c.again) return { ...base, label: 'Again', count: `${punches} punches`, words: words(-1), say: '“Again!”' }
        const current = c.voice.filter(([v]) => tt >= v).length - 1
        const punchNo = c.moves.slice(0, current + 1).filter((m) => m !== 'SLIP').length
        return {
          ...base,
          label: 'Combo',
          count: punchNo > 0 ? `Punch ${punchNo} of ${punches}` : punches === 1 ? '1 punch' : `${punches} punches`,
          words: words(current),
          say: said,
        }
      }
      function placeGlass(pad) {
        const g = $('glass')
        Object.assign(g.style, { left: `${GLASS.x}px`, top: `${GLASS.y}px`, width: `${GLASS.w}px`, height: `${GLASS.h}px`, borderRadius: `${GLASS.r}px` })
        Object.assign($('bezel').style, {
          left: `${GLASS.x - pad}px`,
          top: `${GLASS.y - pad}px`,
          width: `${GLASS.w + 2 * pad}px`,
          height: `${GLASS.h + 2 * pad}px`,
          borderRadius: `${GLASS.r + pad}px`,
        })
      }
      function drawPhone(t) {
        roundWin().setRound?.(roundState(t))
        const out = prog(t, END, PULL)
        // mimo displej v kole kobalt (kamera se smí hýbat), při odjezdu zmizí
        $('bleed').style.opacity = 1 - prog(t, END, 0.28)
        const chrome = prog(t, END + 0.18, 0.2)
        $('glass').querySelector('.island').style.opacity = chrome
        $('glass').querySelector('.status').style.opacity = chrome
        $('bezel').style.display = out > 0 ? 'block' : 'none'
        // telefon odpadne dolů, když přichází výzva
        const drop = easeIn(prog(t, CTA.t - 0.06, 0.3))
        $('glass').style.translate = $('bezel').style.translate = `0 ${drop * 1300}px`
        $('throw').querySelectorAll('.t').forEach((el, j) => roll(el, t, THROW + j * 0.08))
        $('throw').style.transform = `translateY(${-drop * 500}px)`
      }

      // ---------- výzva: zeď z 50 komb appky (kap. 6), rozsvěcí se náhodně ----------
      // prettier-ignore
      const COMBOS = [
        '1', '1 1', '1 2', '1 1 2', '1 2 1', '1 2 3', '2 3', '3 2', '1 2 1 2', '2 3 2', '1 2 kryt', '1 2 vzad', '1 1 2 vzad', 'úklon 2', '1 3',
        '1 2 3 2', '3 2 3', '1 6 3', '1 6 3 2', '1 2 5 2', '1 2 3t', '1 2 1t', '2t 3 2', '3t 3', 'úklon 2 3', '1 2 úklon 2', '1 2 3 ponor',
        '1 2 záklon 2', '1 2 úkrok', '6 3 2', '1 1 2 3', '2 3 2 vzad', '1 2 3 2 kryt',
        '1 1 2 3 2', '3 2 3t', '2 3 2 ponor 2', '6 3 3t', '3 2 3 3t', '1 2 3 ponor 3', '5 4 3t', '2 3t úkrok 3', '1 6t 6', '1 2 3 úklon 3t',
        '1 2 úklon 2 3 2', 'záklon 2 3 2', '1 2 3 2 ponor 2 3', '1 6 3 2 úkrok', '1 2 5 2 3 vzad', '3t 3 2', '1 2 3t 3 2',
      ]
      const EN = { kryt: 'BLOCK', vzad: 'BACK', úklon: 'SLIP', ponor: 'ROLL', záklon: 'PULL', úkrok: 'PIVOT' }
      const chip = (s) => s.split(' ').map((m) => EN[m] ?? m.replace('t', 'B')).join('-')
      let wall50 = []
      let lit50 = []
      let ctaBoxes = []
      const tok50X = (k, t) => k.x + k.dir * 26 * Math.max(0, t - CTA.t)

      function buildCta() {
        const rnd = mulberry32(50)
        const order = COMBOS.map((c) => [rnd(), c]).sort((a, b) => a[0] - b[0]).map(([, c]) => c)
        let n = 0
        for (let r = 0; r < 10; r++) {
          let x = -380 - (r % 3) * 150
          const dir = r % 2 ? -1 : 1
          while (x < 1500) {
            const el = document.createElement('span')
            el.className = 'tok'
            el.textContent = chip(order[n++ % order.length])
            $('wall50').append(el)
            const k = { el, x, y: 236 + r * 102, w: el.offsetWidth, h: el.offsetHeight, dir, row: r }
            wall50.push(k)
            x += k.w + 60
          }
        }
        // poloha textů výzvy (kvůli ztlumení zdi pod nimi)
        $('ctaSub').style.top = `${$('free').getBoundingClientRect().bottom + 34}px`
        $('band').style.top = '1250px'
        ctaBoxes = [$('brand'), $('free'), $('ctaSub')].map((el) => {
          const r = el.getBoundingClientRect()
          return { l: r.left - 20, t: r.top - 14, r: r.right + 20, b: r.bottom + 14 }
        })
        const under = (k, t) => {
          const x = tok50X(k, t)
          return ctaBoxes.some((b) => x < b.r && x + k.w > b.l && k.y < b.b && k.y + k.h > b.t)
        }
        // texty zeď zakrývají až od svého příchodu; pravý horní roh patří nálepce Odkaz
        const hits = (k, t) => t >= CTA.brand && (under(k, t) || k.y < 460)
        // náhodné pořadí: rozsvítí se kombo, které je celé vidět a nic nepřekrývá
        for (let t = CTA.t + 0.14; t < DURATION; t += t < CTA.brand ? 0.07 : 0.26) {
          const free = wall50.filter((k) => tok50X(k, t) > 30 && tok50X(k, t) + k.w < 1050 && k.y > 240 && k.y + k.h < 1240 && !hits(k, t))
          if (free.length) lit50.push({ k: free[Math.floor(rnd() * free.length)], t })
        }
        wall50.under = under
      }

      function drawCta(t) {
        const R = IRIS.r1 * easeIn(prog(t, CTA.t, CTA.iris))
        $('cta').style.clipPath = `circle(${R}px at 540px 1100px)`
        for (const k of wall50) {
          let c = 0
          for (const l of lit50) if (l.k === k && t >= l.t) c = Math.max(c, 1 - easeIn(prog(t, l.t + 0.12, 0.5)))
          const dim = easeOut(prog(t, CTA.brand - 0.05, 0.3))
          const covered = wall50.under(k, t)
          if (covered) c *= 1 - prog(t, CTA.brand - 0.1, 0.12)
          c *= 1 - 0.3 * dim // pod texty už jen tlumeně, ať nesoupeří s výzvou
          k.el.style.opacity = lerp(lerp(0.3, covered ? 0.05 : 0.12, dim), 1, c)
          // řady naskočí střídavě zleva a zprava
          const inP = easeOutExpo(prog(t, CTA.t + 0.05 + k.row * 0.025, 0.4))
          k.el.style.transform = `translate(${tok50X(k, t) + k.dir * -260 * (1 - inP)}px, ${k.y}px)`
        }
        const bp = easeOutExpo(prog(t, CTA.brand, 0.4))
        $('brand').style.clipPath = `inset(-10px ${(1 - bp) * 100}% -10px 0)`
        $('brand').style.visibility = bp > 0 ? 'visible' : 'hidden'
        $('free').querySelectorAll('.t').forEach((el, j) => roll(el, t, CTA.lines + j * 0.09))
        const sp = easeOutExpo(prog(t, CTA.sub, 0.4))
        $('ctaSub').style.opacity = sp
        $('ctaSub').style.transform = `translateY(${(1 - sp) * 24}px)`
        $('band').style.transform = `translateY(${(1 - easeOutExpo(prog(t, CTA.band, 0.45))) * 760}px)`
        const ip = easeOutBack(prog(t, CTA.type - 0.2, 0.3), 2)
        $('band').querySelector('img').style.transform = `scale(${ip})`
        const n = Math.max(0, Math.min(URL.length, Math.floor((t - CTA.type) / TYPE_STEP) + 1))
        $('url').textContent = t < CTA.type ? '' : URL.slice(0, n)
        const typing = t >= CTA.type - 0.15 && n < URL.length
        $('caret').style.visibility = t < CTA.type - 0.15 ? 'hidden' : typing || Math.floor(t * 2.4) % 2 === 0 ? 'visible' : 'hidden'
        const hp = easeOut(prog(t, CTA.hint, 0.35))
        $('hint').style.opacity = hp
        $('hint').style.transform = `translateY(${(1 - hp) * 24}px)`
      }

      // ---------- impact frame: 3 snímky, obří hlášení + paprsky od zásahu ----------
      const FLASHES = [
        ...HOLES.map((h) => ({ t: h.t, text: h.num, x: h.x, y: h.y, bg: '#111', fg: '#f3f2ee' })),
        ...CUTS.map((c) => ({ t: c.flash[0], text: c.flash[1], x: 540, y: 1000, bg: '#fff', fg: '#2c3bff' })),
      ]
      function rays(x, y, seed) {
        const rnd = mulberry32(seed)
        let d = ''
        for (let i = 0; i < 30; i++) {
          const a = (i / 30) * Math.PI * 2 + rnd() * 0.12
          const w = 0.012 + rnd() * 0.03
          const r0 = 260 + rnd() * 260
          const p = (ang, r) => `${(x + Math.cos(ang) * r).toFixed(1)},${(y + Math.sin(ang) * r).toFixed(1)}`
          d += `M${p(a - w, r0)} L${p(a + w, r0)} L${p(a, 2600)}Z `
        }
        return d
      }
      function drawFlash(t) {
        const i = FLASHES.findIndex((f) => t >= f.t && t < f.t + 0.1)
        show($('flash'), i >= 0)
        if (i < 0) return
        const f = FLASHES[i]
        const el = $('flashText')
        $('flash').style.background = f.bg
        $('rays').setAttribute('d', rays(f.x, f.y, 100 + i))
        $('rays').setAttribute('fill', f.fg)
        $('rays').setAttribute('opacity', 0.22)
        el.textContent = f.text
        el.style.color = f.fg
        el.style.fontSize = '100px'
        const fs = f.text.length <= 2 ? 1150 : (100 * 1000) / el.getBoundingClientRect().width
        el.style.fontSize = `${fs}px`
        const r = el.getBoundingClientRect()
        el.style.left = `${Math.min(1080 - r.width * 0.6, Math.max(-r.width * 0.4, f.x - r.width / 2))}px`
        el.style.top = `${f.y - r.height / 2}px`
      }

      // ---------- kamera ----------
      const SHAKES = [
        ...A1.pairs.flatMap((p) => [
          [p, 0.18],
          [p + A1.gap, 0.15],
        ]),
        ...HOLES.map((h) => [h.t, 1.2]),
        [IRIS.t, 0.9],
        [GONG, 1],
        ...CUTS.flatMap((c) => c.hits.map((h) => [h, c.finisher ? 0.55 : 0.7])),
        [END, 0.8],
        [CTA.t + 0.2, 0.5],
      ]
      function shake(t) {
        let sx = 0
        let sy = 0
        SHAKES.forEach(([h, a0], i) => {
          const d = t - h
          if (d < 0 || d > 0.5) return
          const a = 24 * a0 * Math.exp(-d * 13)
          sx += a * Math.sin(d * 2 * Math.PI * 17 + i)
          sy += a * Math.sin(d * 2 * Math.PI * 21 + i * 2)
        })
        return { sx, sy }
      }
      /** Kamera v kole: rámování podle střihu, švihnutí na střih, obrana = pohyb kamery. */
      function roundCam(t) {
        let x = 0
        let y = 0
        let r = 0
        let s = 1
        let origin = [540, 960]
        const k = cutAt(t)
        if (k < 0) s = lerp(1.08, 1, easeOutExpo(prog(t, GONG, 0.3))) * (1 + 0.03 * prog(t, GONG + 0.3, 1.2))
        else {
          const c = CUTS[k]
          s = (c.zoom ?? 1) * (1 + 0.025 * prog(t, c.t, 1))
          r = c.rot ?? 0
          if (c.zoom > 1.06) origin = [540, 1406]
          if (c.dodge) {
            const u = t - c.dodge
            const env = easeOutExpo(prog(u, 0, 0.09)) * (1 - easeInOut(prog(u, 0.16, 0.28)))
            x += -130 * env
            r += -5 * env
          }
          if (c.finisher) s = 1 + 0.12 * easeIn(prog(t, c.t, END - c.t))
        }
        // švihnutí na každý střih (s motion blurem vypadá jako přetočení)
        for (const c of CUTS) {
          const a = prog(t, c.t - 0.08, 0.08)
          const b = prog(t, c.t, 0.1)
          if (t >= c.t - 0.08 && t < c.t) y += -240 * easeIn(a)
          if (t >= c.t && t < c.t + 0.1) y += 240 * (1 - easeOut(b))
        }
        return { x, y, r, s, origin }
      }

      function seek(t) {
        const inRound = t >= GONG
        show($('wall'), t < IRIS.t + IRIS.dur)
        show($('debris'), t < GONG)
        show($('coach'), t >= HOLES[0].t && t < GONG)
        show($('phone'), inRound && t < CTA.t + 0.3)
        show($('bleed'), inRound && t < END + 0.3)
        show($('cta'), t >= CTA.t)

        if (t < GONG) drawWall(t)
        if (t >= HOLES[0].t && t < GONG) drawCoach(t)
        if (inRound && t < CTA.t + 0.3) drawPhone(t)
        if (t >= CTA.t) drawCta(t)
        drawFlash(t)

        // svět: v kole kamera uvnitř displeje, na gong odjede
        const zb = !inRound ? 1 : lerp(Z0, 1, easeInOut(prog(t, END, PULL)))
        $('world').style.transformOrigin = `540px ${OY}px`
        $('world').style.transform = `scale(${zb})`

        let cam = { x: 0, y: 0, r: 0, s: 1, origin: [540, 960] }
        if (t < A1.freeze) cam.s = 1 + 0.015 * prog(t, 0, A1.freeze)
        else if (t < GONG) {
          // ticho před hlášením: pomalý nájezd k místu prvního zásahu
          const p = easeIn(prog(t, A1.freeze, HOLES[0].t - A1.freeze))
          cam = { x: 0, y: 0, r: 0, s: 1.015 + 0.04 * p * (1 - prog(t, HOLES[0].t, 0.2)), origin: [HOLES[0].x, HOLES[0].y] }
        } else if (t < END) cam = roundCam(t)
        const { sx, sy } = shake(t)
        $('cam').style.transformOrigin = `${cam.origin[0]}px ${cam.origin[1]}px`
        $('cam').style.transform = `translate(${cam.x + sx}px, ${cam.y + sy}px) rotate(${cam.r}deg) scale(${cam.s})`
        // malé popisky se s kamerou netřesou (motion blur by je zdvojil)
        for (const el of document.querySelectorAll('.label, .sub')) el.style.translate = `${-sx}px ${-sy}px`
      }

      // ---------- zvuk: bez hudby — hlas a zvuky appky + syntéza ----------
      const clips = {}
      function audible(buffer) {
        const data = buffer.getChannelData(0)
        let first = 0
        while (first < data.length && Math.abs(data[first]) < 0.003) first++
        let last = data.length - 1
        while (last > first && Math.abs(data[last]) < 0.003) last--
        const offset = Math.max(0, first / buffer.sampleRate - 0.01)
        const end = Math.min(buffer.duration, last / buffer.sampleRate + 0.01)
        return { buffer, offset, duration: Math.max(0.05, end - offset) }
      }
      async function loadClips(ctx) {
        for (const id of ['n1', 'n2', 'n3', 'n4', 'n5', 't3', 'uklon', 'posledni', 'znovu', 'naplno', 'hotovo']) {
          const res = await fetch(`${VOICE}${id}.mp3`)
          clips[id] = audible(await ctx.decodeAudioData(await res.arrayBuffer()))
        }
      }

      async function renderAudio() {
        const rate = 48000
        const ctx = new OfflineAudioContext(2, Math.ceil(DURATION * rate), rate)
        const rnd = mulberry32(11)
        const master = ctx.createGain()
        master.gain.value = 0.7
        const comp = ctx.createDynamicsCompressor()
        comp.threshold.value = -10
        comp.knee.value = 6
        comp.ratio.value = 4
        comp.attack.value = 0.003
        comp.release.value = 0.12
        master.connect(comp).connect(ctx.destination)

        // dozvuk: vygenerovaná odezva tělocvičny
        const ir = ctx.createBuffer(2, Math.floor(rate * 1.6), rate)
        for (let ch = 0; ch < 2; ch++) ir.getChannelData(ch).forEach((_, i, dd) => (dd[i] = (rnd() * 2 - 1) * Math.exp((-i / rate) * 4.2)))
        const verb = ctx.createConvolver()
        verb.buffer = ir
        const wet = ctx.createGain()
        wet.gain.value = 0.16
        verb.connect(wet).connect(master)

        const noise = ctx.createBuffer(1, rate * 3, rate)
        noise.getChannelData(0).forEach((_, i, dd) => (dd[i] = rnd() * 2 - 1))
        const sat = ctx.createWaveShaper() // vyšší harmonické, ať je sub slyšet i z telefonu
        sat.curve = Float32Array.from({ length: 1024 }, (_, i) => Math.tanh(((i / 1023) * 2 - 1) * 3))
        sat.connect(master)

        function bus(level = 1, pan = 0, send = 0) {
          const g = ctx.createGain()
          g.gain.value = level
          const p = ctx.createStereoPanner()
          p.pan.value = pan
          g.connect(p).connect(master)
          if (send) {
            const s = ctx.createGain()
            s.gain.value = send
            p.connect(s).connect(verb)
          }
          return g
        }
        function noiseSrc(t, dur) {
          const src = ctx.createBufferSource()
          src.buffer = noise
          src.start(t, rnd() * 1.5, dur + 0.05)
          return src
        }
        function burst(t, freq, q, level, decay, type, dest) {
          const f = ctx.createBiquadFilter()
          f.type = type
          f.frequency.value = freq
          f.Q.value = q
          const g = ctx.createGain()
          g.gain.setValueAtTime(level, t)
          g.gain.exponentialRampToValueAtTime(0.0001, t + decay)
          noiseSrc(t, decay).connect(f).connect(g).connect(dest)
        }
        function tone(t, type, f0, f1, glide, level, attack, decay, dest) {
          const o = ctx.createOscillator()
          o.type = type
          o.frequency.setValueAtTime(f0, t)
          o.frequency.exponentialRampToValueAtTime(f1, t + glide)
          const g = ctx.createGain()
          g.gain.setValueAtTime(0.0001, t)
          g.gain.exponentialRampToValueAtTime(level, t + attack)
          g.gain.exponentialRampToValueAtTime(0.0001, t + decay)
          o.connect(g).connect(dest)
          o.start(t)
          o.stop(t + decay + 0.05)
        }
        /** Úder do pytle: prasknutí rukavice + tlumený úder + sub. */
        function punch(t, level = 1, pan = 0) {
          const b = bus(level, pan, 0.3)
          tone(t, 'sine', 95, 38, 0.3, 0.9 * level, 0.003, 0.5, sat)
          tone(t, 'sine', 140, 50, 0.1, 0.8, 0.002, 0.28, b)
          burst(t, 700, 0.7, 0.6, 0.08, 'lowpass', b)
          burst(t, 3000, 0.6, 0.5, 0.03, 'highpass', b)
          burst(t, 1300, 1.5, 0.35, 0.02, 'bandpass', b)
        }
        /** Výdech boxera při úderu („ts"). */
        function exhale(t, level = 1, pan = 0) {
          t = Math.max(0, t)
          const b = bus(level * 0.32, pan, 0.15)
          const f = ctx.createBiquadFilter()
          f.type = 'bandpass'
          f.frequency.value = 5200
          f.Q.value = 0.9
          const g = ctx.createGain()
          g.gain.setValueAtTime(0.0001, t)
          g.gain.exponentialRampToValueAtTime(1, t + 0.012)
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13)
          noiseSrc(t, 0.14).connect(f).connect(g).connect(b)
        }
        /** Cinknutí řetězů pytle po zásahu. */
        function chains(t, level = 1) {
          for (let i = 0; i < 7; i++) {
            const tt = t + 0.04 + rnd() * 0.3
            const f = 2600 + rnd() * 2600
            const b = bus(level * (0.05 + rnd() * 0.07), rnd() * 1.2 - 0.6)
            tone(tt, 'sine', f, f, 0.01, 1, 0.001, 0.08 + rnd() * 0.08, b)
            tone(tt, 'sine', f * 2.76, f * 2.76, 0.01, 0.5, 0.001, 0.05, b)
          }
        }
        /** Průraz zdí: hluboký dopad + trosky slov dopadají kolem. */
        function smash(t, level = 1, pan = 0) {
          tone(t, 'sine', 70, 28, 0.6, 0.9 * level, 0.004, 0.9, sat)
          burst(t, 900, 0.5, 0.7 * level, 0.25, 'lowpass', bus(1, pan, 0.4))
          for (let i = 0; i < 26; i++) {
            const tt = t + 0.03 + rnd() ** 1.6 * 0.7
            burst(tt, 1800 + rnd() * 5000, 1.2, 0.18 * level * (1 - (tt - t) / 0.8), 0.015 + rnd() * 0.03, 'bandpass', bus(1, rnd() * 1.6 - 0.8))
          }
        }
        function whoosh(t, dur, f0, f1, level, pan0 = 0, pan1 = 0) {
          const f = ctx.createBiquadFilter()
          f.type = 'bandpass'
          f.Q.value = 1.3
          f.frequency.setValueAtTime(f0, t)
          f.frequency.exponentialRampToValueAtTime(f1, t + dur)
          const g = ctx.createGain()
          g.gain.setValueAtTime(0.0001, t)
          g.gain.linearRampToValueAtTime(level, t + dur * 0.75)
          g.gain.linearRampToValueAtTime(0.0001, t + dur)
          const p = ctx.createStereoPanner()
          p.pan.setValueAtTime(pan0, t)
          p.pan.linearRampToValueAtTime(pan1, t + dur)
          noiseSrc(t, dur).connect(f).connect(g).connect(p).connect(master)
        }
        /** Přetočení na střih: rychlé cvakání číslic + švih nahoru. */
        function zip(t) {
          for (let i = 0; i < 9; i++) tick(t - 0.16 + i * 0.018, 2200 + i * 160, 0.06)
          whoosh(t - 0.1, 0.16, 900, 6500, 0.32)
        }
        function tick(t, f, level, pan = 0) {
          const b = bus(level, pan)
          tone(t, 'sine', f, f * 0.8, 0.02, 0.8, 0.001, 0.03, b)
          burst(t, 6000, 0.7, 0.4, 0.008, 'highpass', b)
        }
        function riser(t0, t1, level) {
          const f = ctx.createBiquadFilter()
          f.type = 'highpass'
          f.frequency.setValueAtTime(400, t0)
          f.frequency.exponentialRampToValueAtTime(7000, t1)
          const g = ctx.createGain()
          g.gain.setValueAtTime(0.0001, t0)
          g.gain.exponentialRampToValueAtTime(level, t1 - 0.02)
          g.gain.linearRampToValueAtTime(0, t1)
          noiseSrc(t0, t1 - t0).connect(f).connect(g).connect(master)
        }
        function room(t0, t1, level) {
          const f = ctx.createBiquadFilter()
          f.type = 'lowpass'
          f.frequency.value = 260
          const g = ctx.createGain()
          g.gain.setValueAtTime(0.0001, t0)
          g.gain.linearRampToValueAtTime(level, t0 + 0.05)
          g.gain.setValueAtTime(level, t1 - 0.12)
          g.gain.linearRampToValueAtTime(0.0001, t1)
          noiseSrc(t0, t1 - t0).connect(f).connect(g).connect(master)
        }
        // gong a klepnutí stejnou syntézou jako src/audio/sounds.ts
        function strike(t) {
          const b = bus(0.42, 0, 0.3)
          for (const [ratio, amp] of [
            [1, 1],
            [2.32, 0.55],
            [4.25, 0.32],
            [6.63, 0.18],
          ]) {
            tone(t, 'sine', 830 * ratio, 830 * ratio, 0.01, amp, 0.005, 1.6 / Math.sqrt(ratio), b)
          }
          burst(t, 3200, 0.8, 0.5, 0.04, 'bandpass', b)
        }
        const bell = (t, times) => {
          for (let i = 0; i < times; i++) strike(t + 0.02 + i * 0.42)
        }
        const clap = (t) => burst(t, 2000, 1.2, 1, 0.06, 'bandpass', bus(1, 0, 0.25))
        function voice(t, id, level = 1, pan = 0) {
          const c = clips[id]
          const src = ctx.createBufferSource()
          src.buffer = c.buffer
          src.connect(bus(level, pan, 0.1))
          src.start(t, c.offset, c.duration)
        }

        // autopilot: líné dvojice úderů, tlumený gym; před hlášením ticho
        room(0, A1.freeze, 0.06)
        A1.pairs.forEach((p, i) => {
          ;[0, A1.gap].forEach((d, j) => {
            punch(p + d, 0.5, j ? 0.25 : -0.25)
            exhale(p + d - 0.01, 0.45, j ? 0.25 : -0.25)
          })
          chains(p + A1.gap, 0.5 + 0.1 * i)
        })
        // hlášení: trenér volá, zeď praská
        HOLES.forEach((h, i) => {
          voice(h.call + 0.02, h.clip, 1.1)
          whoosh(h.t - 0.16, 0.18, 700, 3800, 0.45, [-0.6, 0.7, -0.7][i], [0.2, -0.3, 0.4][i])
          punch(h.t, 1.1, [-0.2, 0.3, -0.1][i])
          exhale(h.t - 0.02, 1, [-0.2, 0.3, -0.1][i])
          smash(h.t, i === 2 ? 1.2 : 1, [-0.3, 0.4, 0][i])
          chains(h.t, 1)
        })
        whoosh(IRIS.t - 0.04, IRIS.dur + 0.12, 220, 2600, 0.6)
        smash(IRIS.t + 0.1, 0.8)
        riser(CAP - 0.1, GONG, 0.42)
        room(CAP, GONG, 0.07)
        // poslední kolo
        bell(GONG - 0.02, 1)
        punch(GONG, 0.5)
        voice(LAST_SAY, 'posledni')
        CUTS.forEach((c) => {
          zip(c.t)
          for (const [v, id] of c.voice) voice(v + 0.02, id)
          c.hits.forEach((h, j) => {
            const pan = j % 2 ? 0.3 : -0.3
            punch(h, c.finisher ? 0.85 : 1, pan)
            exhale(h - 0.02, c.finisher ? 0.7 : 1, pan)
          })
          if (c.hits.length && !c.finisher) chains(c.hits.at(-1), 0.8)
          if (c.dodge) whoosh(c.dodge - 0.03, 0.22, 700, 4800, 0.55, 0.7, -0.7)
          if (c.claps) c.claps.forEach((t) => clap(t))
          if (c.finisher) chains(c.hits.at(-1), 1.2)
        })
        // konec kola: 3× gong, kamera odjede
        bell(END, 3)
        whoosh(END - 0.02, PULL, 2600, 300, 0.4)
        voice(END + 0.2, 'hotovo')
        // výzva
        whoosh(CTA.t - 0.1, CTA.iris + 0.1, 180, 1800, 0.5)
        punch(CTA.t + 0.2, 0.55)
        // náhodně rozsvícená komba cvaknou (jen úvodní dávka, pak by rušila psaní adresy)
        for (const l of lit50) if (l.t < CTA.brand) tick(l.t, 1300 + rnd() * 1300, 0.09, rnd() * 1.2 - 0.6)
        for (let i = 0; i < URL.length; i++) tick(CTA.type + i * TYPE_STEP, 1600 + rnd() * 900, 0.08, rnd() * 0.4 - 0.2)

        const out = await ctx.startRendering()
        const L = out.getChannelData(0)
        const R = out.getChannelData(1)
        // WAV 16 bit stereo
        const n = L.length
        const buf = new DataView(new ArrayBuffer(44 + n * 4))
        const str = (o, s) => [...s].forEach((ch, i) => buf.setUint8(o + i, ch.charCodeAt(0)))
        str(0, 'RIFF')
        buf.setUint32(4, 36 + n * 4, true)
        str(8, 'WAVEfmt ')
        buf.setUint32(16, 16, true)
        buf.setUint16(20, 1, true)
        buf.setUint16(22, 2, true)
        buf.setUint32(24, rate, true)
        buf.setUint32(28, rate * 4, true)
        buf.setUint16(32, 4, true)
        buf.setUint16(34, 16, true)
        str(36, 'data')
        buf.setUint32(40, n * 4, true)
        const s16 = (v) => Math.max(-1, Math.min(1, v)) * 0x7fff
        for (let i = 0; i < n; i++) {
          buf.setInt16(44 + i * 4, s16(L[i]), true)
          buf.setInt16(46 + i * 4, s16(R[i]), true)
        }
        let bin = ''
        const bytes = new Uint8Array(buf.buffer)
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000))
        return btoa(bin)
      }

      // ---------- start ----------
      /** Řádek přesně na šířku sazby — titulky stojí na mřížce. */
      function fit(el) {
        el.style.fontSize = '100px'
        el.style.fontSize = `${(100 * W) / el.getBoundingClientRect().width}px`
      }
      function build() {
        // měří se všechno viditelné
        const grps = [...document.querySelectorAll('.grp')]
        grps.forEach((g) => (g.style.display = 'block'))
        for (const el of [...$('cap').querySelectorAll('.t'), ...$('throw').querySelectorAll('.t'), ...$('free').querySelectorAll('.t')]) fit(el)
        buildHook()
        buildWall()
        buildDebris()
        buildHoles()
        buildCta()
        placeGlass(12 * PS)
        // glass: island a stavový řádek v měřítku telefonu
        const isl = $('glass').querySelector('.island')
        Object.assign(isl.style, { top: `${11 * PS}px`, width: `${126 * PS}px`, height: `${37 * PS}px` })
        const st = $('glass').querySelector('.status')
        Object.assign(st.style, { top: `${17 * PS}px`, height: `${25 * PS}px`, padding: `0 ${30 * PS}px 0 ${48 * PS}px`, fontSize: `${17 * PS}px` })
        st.querySelector('.icons').style.gap = `${6 * PS}px`
        st.querySelectorAll('svg').forEach((s) => (s.style.height = `${13 * PS}px`))
        $('round').style.transform = `scale(${PS})`
        grps.forEach((g) => (g.style.display = 'none'))
      }
      const frameLoaded = new Promise((r) => {
        if ($('round').contentDocument?.readyState === 'complete' && $('round').contentWindow.setRound) r()
        else $('round').addEventListener('load', () => r(), { once: true })
      })
      window.ready = (async () => {
        await loadClips(new OfflineAudioContext(1, 1, 48000))
        await frameLoaded
        await document.fonts.load('900 100px Archivo', 'ABC123→')
        await document.fonts.load('700 100px Archivo', 'ABC123→')
        await document.fonts.load('500 100px Archivo', 'ABC123→·')
        await document.fonts.ready
        await $('round').contentDocument.fonts.ready
        build()
        seek(0)
      })()
      window.seek = async (t) => {
        seek(t)
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
      }
      window.renderAudio = renderAudio
      window.FPS = FPS
      window.DURATION = DURATION
      window.SUBFRAMES = SUBFRAMES
      window.GRAIN = GRAIN

      // Náhled: ?play přehrává dokola (bez zvuku), ?t=5.4 ukáže jeden okamžik.
      window.ready.then(() => {
        if (query.has('t')) seek(Number(query.get('t')))
        if (query.has('play')) {
          const t0 = performance.now()
          const loop = (now) => {
            seek(((now - t0) / 1000) % DURATION)
            requestAnimationFrame(loop)
          }
          requestAnimationFrame(loop)
        }
      })
    </script>
  </body>
</html>
